name: Build Stable Release APK

on:
  push:
    branches: [ feat/*, main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: |
          bun install
          pnpm install

      - name: Setup Signing Keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Using secure repository secret keystore"
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          else
            echo "No secret found, generating ephemeral fallback keystore"
            keytool -genkey -v -keystore app/release.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Release,O=Android,C=US"
          fi
          cat << 'EOF' > local.properties
storeFile=app/release.keystore
storePassword=android
keyAlias=androiddebugkey
keyPassword=android
EOF

      - name: Build Stable Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-parallel --stacktrace

      - name: Upload Stable Release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rikkahub-agent-stable-release-arm64-v8a
          path: app/build/outputs/apk/**/release/*arm64-v8a*.apk
          retention-days: 7
