# Verified with `javap -p` against the published artifact: Shizuku.newProcess is PRIVATE in
# this version, so shizuku_exec is built on Shizuku.bindUserService + our own AIDL service
# instead (see ShizukuManager.kt).
shizuku = "13.1.5"
genaiPrompt = "1.0.0-beta2"
# Pinned below 0.14.0 deliberately. 0.14.0 drops libLiteRtClGlAccelerator.so and moves
# the GPU backend from OpenCL/GLES to Dawn/WebGPU-on-Vulkan, which Adreno 6xx rejects:
# every CreateComputePipelines call returns VK_ERROR_UNKNOWN, the delegate keeps
# submitting the resulting invalid command buffers, and the native execution thread
# SIGSEGVs. That is unrecoverable from Kotlin, so the accelerator fallback cannot catch
# it. 0.13.1 has an identical public API (same classes, same tool-calling surface,
# getTokenCount/getBenchmarkInfo/cancelProcess all present) and a working GPU path.
litertlm = "0.13.1"
snakeyaml = "2.6"

