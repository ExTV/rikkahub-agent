<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Spinning Label</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      height: 100%;
      overflow: hidden; background: #0b0f1a;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    #container {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100%; min-height: 0;
      perspective: 1000px;
    }
    #spinning-label {
      display: inline-block;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: white; padding: 3vmin 6vmin;
      border-radius: 50px; font-weight: 800;
      text-transform: uppercase; white-space: nowrap;
      box-shadow: 0 10px 30px rgba(0, 150, 255, 0.4);
      transform-style: preserve-3d;
      font-size: clamp(16px, 8vmin, 64px);
      animation: spin 4s linear infinite;
    }
    @keyframes spin {
      from { transform: rotateY(0deg); }
      to { transform: rotateY(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      #spinning-label {
        animation: none;
        transform: rotateY(20deg);
      }
    }
  </style>
</head>
<body>

  <div id="container">
    <div id="spinning-label"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const label = urlParams.get('label');
    document.getElementById('spinning-label').textContent = label && label.trim() ? label : '3D LABEL';
  </script>
</body>
</html>
