<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>3D 88-Key Virtual Piano</title>
    <style>
      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background-color: #1e1e2f;
        display: flex;
        overflow-y: hidden;
      }

      #piano-scroll-container {
        width: 100%;
        height: 100%;
        min-height: 0;
        box-sizing: border-box;
        overflow-x: auto;
        white-space: nowrap;
        -ms-overflow-style: none;
        scrollbar-width: none;
        padding: 20px;
        touch-action: pan-x;
      }
      #piano-scroll-container::-webkit-scrollbar {
        display: none;
      }

      #piano {
        display: inline-flex;
        flex-direction: column;
        height: 100%;
        box-sizing: border-box;
        background: #222;
        padding: 10px 10px 0 10px;
        border-radius: 12px;
        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.8),
          inset 0 2px 5px rgba(255, 255, 255, 0.1);
      }

      #key-container {
        display: flex;
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
      }

      /* THE FIX: Explicitly lock the wrapper to 60px and remove the z-index bias! */
      .key-group {
        position: relative;
        display: block;
        width: 60px;
        height: 100%;
        flex-shrink: 0;
      }

      #scroll-lip {
        height: 60px;
        flex-shrink: 0;
        background: linear-gradient(to bottom, #333, #1a1a1a);
        border-top: 2px solid #111;
        border-radius: 0 0 10px 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 -10px;
        color: #666;
        font-family: sans-serif;
        font-size: 16px;
        font-weight: bold;
        letter-spacing: 3px;
        user-select: none;
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
      }

      /* White Keys */
      .key.white {
        touch-action: pan-x;
        width: 100%;
        height: 100%; /* fills the height-flexible key row */
        background: linear-gradient(to bottom, #ffffff 80%, #f0f0f0 100%);
        box-sizing: border-box;
        border-right: 1px solid #ccc;
        border-bottom: 2px solid #bbb;
        border-radius: 0 0 6px 6px;
        box-shadow: 0 4px 5px rgba(0, 0, 0, 0.2);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 15px;
        font-family: sans-serif;
        font-size: 14px;
        font-weight: bold;
        color: #aaa;
        user-select: none;
        position: relative;
        z-index: 1; /* All white keys are equal! */
      }
      .key-group:first-child .key.white {
        border-left: 1px solid #ccc;
      }

      .key.white:active,
      .key.white.active {
        background: #e0e0e0;
        box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.4);
        color: #333;
      }

      /* Black Keys */
      .key.black {
        touch-action: pan-x;
        width: 30px;
        height: 56%; /* preserves the 140/250 black-to-white key ratio */
        background: linear-gradient(to bottom, #444, #000);
        position: absolute;
        right: -15px; /* Sits perfectly in the middle of the borders */
        top: 0;
        z-index: 10; /* All black keys sit safely on top */
        box-sizing: border-box;
        border-radius: 0 0 5px 5px;
        border: 1px solid #111;
        border-bottom: 3px solid #000;
        box-shadow: 2px 4px 6px rgba(0, 0, 0, 0.5);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .key.black:active,
      .key.black.active {
        background: #111;
        box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.9);
      }
    </style>
  </head>
  <body>
    <div id="piano-scroll-container">
      <div id="piano">
        <div id="key-container"></div>
        <div id="scroll-lip">⟷ SLIDE HERE TO SCROLL ⟷</div>
      </div>
    </div>

    <script>
      const keyContainer = document.getElementById("key-container");
      let noteNumber = 1;
      const noteNamesArray = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

      // 1. GENERATE THE KEYS (No more biased Z-Index loop!)
      while (noteNumber <= 88) {
        const group = document.createElement("div");
        group.className = "key-group";

        const cOffset = (noteNumber + 8) % 12;
        const noteName = noteNamesArray[cOffset];
        const octave = Math.floor((noteNumber + 8) / 12);

        const whiteKey = document.createElement("div");
        whiteKey.className = "key white";
        whiteKey.setAttribute("data-note", noteNumber);
        whiteKey.innerText = noteName + octave;
        group.appendChild(whiteKey);

        if (cOffset !== 4 && cOffset !== 11 && noteNumber !== 88) {
          noteNumber++;
          const blackKey = document.createElement("div");
          blackKey.className = "key black";
          blackKey.setAttribute("data-note", noteNumber);
          group.appendChild(blackKey);
        }

        keyContainer.appendChild(group);
        noteNumber++;
      }

      // 2. THE AUDIO ENGINE — notes are synthesized with WebAudio instead of shipping
      // 88 sampled mp3 files. Key 1 is A0 (27.5 Hz); each key is one semitone up.
      let audioCtx = null;

      function playNote(note) {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }
        const freq = 27.5 * Math.pow(2, (note - 1) / 12);
        const now = audioCtx.currentTime;
        // High notes ring shorter than low notes, like a real piano.
        const duration = 2.2 - (note / 88) * 1.2;
        const master = audioCtx.createGain();
        // Percussive attack then exponential decay, roughly piano-shaped.
        master.gain.setValueAtTime(0.0001, now);
        master.gain.exponentialRampToValueAtTime(0.4, now + 0.012);
        master.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        master.connect(audioCtx.destination);
        // Fundamental plus a few decaying harmonics for a warmer-than-sine tone.
        [
          [1, 1.0],
          [2, 0.35],
          [3, 0.15],
          [4, 0.08],
        ].forEach(([harmonic, level]) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "sine";
          osc.frequency.value = freq * harmonic;
          gain.gain.value = level;
          osc.connect(gain);
          gain.connect(master);
          osc.start(now);
          osc.stop(now + duration);
        });
      }

      const keys = document.querySelectorAll(".key");

      keys.forEach((key) => {
        key.addEventListener("pointerdown", function (event) {
          event.stopPropagation();

          const note = Number(this.getAttribute("data-note"));
          if (note >= 1 && note <= 88) {
            playNote(note);
            this.classList.add("active");
          }
        });

        key.addEventListener("pointerup", function () {
          this.classList.remove("active");
        });
        key.addEventListener("pointerleave", function () {
          this.classList.remove("active");
        });
        key.addEventListener("pointercancel", function () {
          this.classList.remove("active");
        });
      });

      // 3. AUTO-SCROLL TO MIDDLE C
      setTimeout(() => {
        const middleC = document.querySelector('.key.white[data-note="40"]');
        if (middleC) {
          middleC.scrollIntoView({ behavior: "auto", inline: "center", block: "nearest" });
        }
      }, 50);
    </script>
  </body>
</html>
